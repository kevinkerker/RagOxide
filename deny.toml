# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
#
# Only licenses that permit commercial use and redistribution are allowed
# (ADR 0012). MPL-2.0 and CDLA-Permissive-2.0 are allowed explicitly for the
# docling.rs dependency tree (ADR 0011). Copyleft licenses that would bind the
# application (GPL, LGPL, AGPL) and non-commercial or research-only licenses
# are not on the list and therefore rejected.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# An unmaintained crate fails the check only if a workspace crate depends on it
# directly. Vulnerabilities and yanked versions fail for the whole tree (ADR 0104).
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

# Workspace crates are not published (`publish = false`) and carry the project's own
# license FSL-1.1-ALv2 (ADR 0019). They are skipped here. FSL-1.1-ALv2 is deliberately
# not in `allow`, so a third-party crate under it is still rejected.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# docling.rs comes from our own fork, pinned to a commit that carries two fixes
# on top of v2.84.2 (ADR 0011, ADR 0032).
allow-git = ["https://github.com/kevinkerker/docling.rs"]
