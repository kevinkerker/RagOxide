language = "de"
question = "Wie viele neue Schulden darf der Bund laut Schuldenbremse pro Jahr machen?"
answerable = true
kind = "fact"
features = ["synonym", "compound", "multiple_locations"]
answer = "Grundsätzlich Kredite von höchstens 0,35 % des nominalen Bruttoinlandsprodukts; hinzu kommen eine konjunkturelle Komponente und Ausnahmen bei Naturkatastrophen und außergewöhnlichen Notsituationen (Art. 109 Abs. 3, Art. 115 Abs. 2 GG)."
shared_terms = []
term_variants = ["Schulden -> Einnahmen aus Krediten", "Schuldenbremse -> kommt im Text nicht vor", "pro Jahr -> jährlichen Nettokreditaufnahme (Art. 115, nach dem Zitat)"]
notes = "Die Wikipedia-Seite nennt die Schuldenbremse mehrfach, aber keinen Wert; sie ist kein Beleg."

[[questions.evidence]]
part = 1
document = "de-grundgesetz-bundestag-gesetze-77abca2"
heading_path = ["X. - Das Finanzwesen", "Art 115"]
quote = "Einnahmen und Ausgaben sind grundsätzlich ohne Einnahmen aus Krediten auszugleichen. Diesem Grundsatz ist entsprochen, wenn die Einnahmen aus Krediten 0,35 vom Hundert im Verhältnis zum nominalen Bruttoinlandsprodukt nicht überschreiten."

[[questions.evidence]]
part = 1
document = "de-grundgesetz-bundestag-gesetze-77abca2"
heading_path = ["X. - Das Finanzwesen", "Art 109"]
quote = "Die nähere Ausgestaltung regelt für den Haushalt des Bundes Artikel 115 mit der Maßgabe, dass Satz 1 entsprochen ist, wenn die Einnahmen aus Krediten 0,35 vom Hundert im Verhältnis zum nominalen Bruttoinlandsprodukt nicht überschreiten."

