[[questions]]
id = "de-01"
language = "de"
question = "Können Bundestagsabgeordnete für das, was sie im Plenum sagen, vor Gericht gestellt werden?"
answerable = true
kind = "fact"
features = ["inflection", "synonym", "compound"]
answer = "Nein: Wegen Abstimmungen und Äußerungen im Bundestag oder in seinen Ausschüssen dürfen Abgeordnete zu keiner Zeit gerichtlich oder dienstlich verfolgt werden, ausgenommen verleumderische Beleidigungen (Art. 46 Abs. 1 GG)."
shared_terms = []
term_variants = ["Bundestagsabgeordnete -> Abgeordneter, im Bundestage", "Gericht -> gerichtlich", "sagen -> Äußerung", "Plenum -> im Bundestage"]

[[questions.evidence]]
part = 1
document = "de-grundgesetz-bundestag-gesetze-77abca2"
heading_path = ["III. - Der Bundestag", "Art 46"]
quote = "Ein Abgeordneter darf zu keiner Zeit wegen seiner Abstimmung oder wegen einer Äußerung, die er im Bundestage oder in einem seiner Ausschüsse getan hat, gerichtlich oder dienstlich verfolgt oder sonst außerhalb des Bundestages zur Verantwortung gezogen werden. Dies gilt nicht für verleumderische Beleidigungen."

[[questions]]
