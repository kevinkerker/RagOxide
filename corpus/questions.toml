# Question catalogue for measuring retrieval and citations (ADR 0005, ADR 0007).
# 50 questions on the documents in documents/, about half German, half English.
# Checked by verify_questions.py. Overview, sample and how to add a question: README.md.
#
# Field names and fixed values are English; questions, answers and quotes are in
# the language of the question or document. Only single-line strings are used.
#
# [[questions]]
#   id             "de-NN" or "en-NN", unique; the prefix is the language of the question
#   language       "de" | "en"
#   question       wording as an office user would ask it, deliberately not the wording of the source
#   answerable     true | false; false means the corpus does not answer the question and the
#                  expected behaviour is to say so instead of inventing an answer
#   kind           "fact"          answer in running text
#                  "table_value"   answer is a value in a table
#                  "multi_part"    answer needs two or more passages (see part below)
#                  "unanswerable"  answerable = false
#   features       any of: scan (evidence on a scanned page), scan_table (value in a table on a scan,
#                  known parser weakness, ADR 0031), multi_column, digital_table (table in a born-digital
#                  document, office file or HTML), office, footnote, speaker_notes, merged_cells,
#                  broken_text_layer, parallel_text (the same passage also exists in the other-language
#                  edition), cross_document (parts in different documents), multiple_locations (several
#                  equally valid places in one part), compound, inflection, synonym, abbreviation
#                  (how the question's wording differs from the source)
#   answer         expected answer in one sentence; for unanswerable questions what a correct reply says
#   shared_terms   content words that occur unchanged (as whole words, case-insensitive) in the question
#                  and in at least one quote; [] if none
#   term_variants  "question form -> source form" for words the question has only in another form:
#                  inflection, other compound split, synonym, abbreviation, or a word that only occurs
#                  in a table header or title next to the quote
#   notes          optional: distractors, limits of the evidence
#
# [[questions.evidence]]  answerable questions only, at least one
#   part           1, 2, ...: every part is needed for the answer; entries with the same part are
#                  alternatives, any one of them is enough
#   document       id from manifest.toml
#   anchor, by format of the document (ADR 0010):
#     page           pdf, jpeg: 1-based physical page in the file (not the printed page number)
#     slide          pptx: 1-based slide number
#     sheet, cells   xlsx: sheet name and A1 cell range of the row(s) holding the value
#     heading_path   docx, html, markdown: section headings from outermost to innermost, without the
#                    document title and without numbering
#   quote          verbatim excerpt of the original as it is displayed (scans transcribed from the page
#                  image, line-break hyphenation undone, table cells separated by " | ")
#   parallel       optional, true: same passage in the other-language edition of a parallel text
#
# [[questions.near_miss]]  unanswerable questions only, at least one
#   document, anchor, quote as above, reason: a passage the search is likely to return although it
#   does not answer the question; never correct evidence
#
# Matching rules for a measurement
#   A search hit matches an evidence entry if the document is the same and
#     pdf, jpeg: the hit's page (or one of its pages) equals page;
#     pptx: the hit's slide equals slide;
#     xlsx: same sheet and the hit's cell range overlaps cells;
#     docx, html, markdown: every heading_path element, in order, is contained in an element of the
#       hit's heading path after normalisation; extra elements (document title, numbering such as
#       "8 ", clause paragraphs styled as headings) are allowed.
#   A question counts as found if for every part at least one of its entries matches one of the first
#   ten hits. Unanswerable questions are not part of the hit rate.
#   Normalisation for comparing text: Unicode NFC, soft hyphens (U+00AD) removed, "|" treated as a
#   space, runs of whitespace collapsed to one space, case-folded for heading comparison.

schema_version = 1

