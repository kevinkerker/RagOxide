# Shared model manifest: the only place for model names, sources, checksums, tiers and
# answer levels. Parsed into `kb_core::ModelManifest`, read by kb-hub and kb-llm.
# Models: ADR 0013 (embedding, reranker, fallbacks), ADR 0055 and 0063 (answer models
# in three levels), ADR 0011 (parser models from docling.rs).
#
# Sources (ADR 0077): every file has exactly one `source`, without a fallback:
#   source = { kind = "hugging_face", repo = "<owner>/<name>", revision = "<commit>" }
#     unchanged file, https://huggingface.co/<repo>/resolve/<revision>/<path>
#   source = { kind = "github_release", repo = "<owner>/<name>", tag = "<tag>", asset = "<name>" }
#     file made or changed by the project, https://github.com/<repo>/releases/download/<tag>/<asset>
# A source with an open part (no repo, revision or tag yet) or no source at all has no
# address; kb-hub cannot download such a file and reports it as `Error::Model`.
# Files made or changed by the project are assets of releases in the project
# repository kevinkerker/RagOxide (ADR 0079). Release tags are numbered: the first is
# models-1, the next models-2 and so on (ADR 0090). The tag is entered once the release
# exists; until then it stays open.
#
# PLACEHOLDERS. A missing `source` part or `sha256` is not an oversight but means "not
# verified yet". Values for the answer models and llama-server are taken from
# docs/analyse/tempomessung.md, for embedding and reranker from
# docs/analyse/embedding-test.md ("Dateien und Prüfsummen"): downloaded through the
# pinned commit, sizes exact, SHA-256 computed locally and equal to the checksum Hugging
# Face or GitHub states. Everything else is not verified: `size_bytes` marked UNVERIFIED
# is a rounded size from the analyses (decimal units) for showing the download size, a
# missing one is unknown. kb-hub must reject any file without `sha256`.
#
# Licences: the licence of each entry is its `license` field (SPDX). For the answer
# models it is the licence the Hugging Face API states (docs/analyse/tempomessung.md),
# for embedding and reranker the one on the model cards (docs/analyse/embedding-test.md);
# for the parser models it is taken from the documentation of docling.rs
# (docs/analyse/docling-rs.md), not checked against the model cards of their makers;
# for the fallback entries it is not verified. Files made or changed by the project
# (the release assets) are marked as changed from the original, and the licence text
# is attached to the release (Apache 2.0, section 4 b; ADR 0077).
#
# Units: `preference` 1 = planned model, 2 = first fallback, 3 = second fallback.
# Tiers (ADR 0056): "supported" (16 GB and more, all levels, with reranker) and
# "below_minimum" (attempt allowed, fast level only, no reranker).
# Levels (ADR 0055, names ADR 0067): "fast" (Schnell), "balanced" (Ausgewogen),
# "thorough" (Gründlich).
# Embedding: every file variant of an embedding model needs its own `id`, so that the
# index notices a change of variant (docs/analyse/embedding-test.md).

schema_version = 4

