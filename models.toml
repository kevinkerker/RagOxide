# ---------------------------------------------------------------- answer models (ADR 0055)
# One model per level; `mtp_draft` switches multi-token prediction on when the server
# starts (ADR 0063), on the hardware tiers in `mtp_tiers` (ADR 0084): below the minimum
# the fast model runs without its drafter, which is then neither provided nor loaded. Gains in generation speed from docs/analyse/tempomessung.md
# ("Multi-Token Prediction", alternating comparison): E2B x1.63 at 916 prompt tokens and
# x0.93 at 7,968; E4B x1.36 and x1.29; 12B Q4_K_M with its own drafter x1.34. The prompt
# cap of about 4,000 tokens (ADR 0081) lies between the two E2B points and is not
# measured. Google's 12B QAT file is not used: MTP slows it down (B4, ADR 0063).

[[models]]
id = "gemma-4-e2b"
name = "Gemma 4 E2B (GGUF Q4_K_M, MTP drafter Q8_0)"
role = "generator"
level = "fast"
tiers = ["supported", "below_minimum"]
preference = 1
# Not on below_minimum (ADR 0084): there the drafter would cost about 0.18 GB more
# working set, where the calculation for 8 GB leaves 0.1 GB reserve without reranker
# (tempomessung.md).
# REPRODUCIBILITY: with this drafter, greedy texts (temperature 0) differ from those
# without it (measured at 1,000 and 8,000 prompt tokens; E4B and 12B stay word for word
# identical, tempomessung.md "Antworten"). kb-eval and tests must not expect E2B texts
# to be word for word equal across MTP on and off; repeated runs with MTP are not
# examined.
mtp_draft = "mtp-gemma-4-E2B-it.gguf"
mtp_tiers = ["supported"]
license = "Apache-2.0"
source = "https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF"

